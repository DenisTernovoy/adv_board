name: workflow.yml
on: [push,]

jobs:
  linters:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.14

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install black

      - name: Run linters
        run: |
          flake8 .
          black .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.14

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run tests
        env:
          DB_NAME: postgres
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          CORS_ALLOWED_ORIGINS: http://localhost:80;http://localhost:8000
          CSRF_TRUSTED_ORIGINS: http://localhost:80;http://localhost:8000
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: poetry run python3 manage.py test